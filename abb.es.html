<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola, mundo - Versión2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
    }

    .card {
      width: 90%;
      max-width: 560px;
      padding: 50px 35px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 50px;
    }

    p {
      margin: 0 auto 30px;
      max-width: 430px;
      color: #dbeafe;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 50px;
      background: white;
      color: #312e81;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="icon">✨</div>

    <h1>Hola, mundo</h1>

    <p>
      Una página sencilla, moderna y bonita.
      Un pequeño espacio para presentar una idea,
      un proyecto o simplemente dar la bienvenida.
    </p>

    <a href="#">Empezar</a>
  </main>

</body>
</html>
